name: Build APK

on:
  push:
    branches: [ "claude/**", "master", "main" ]
  workflow_dispatch:

jobs:
  build-ffmpeg:
    name: Build FFmpeg (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [ arm64-v8a ]
    steps:
      - uses: actions/checkout@v4

      - name: Hash build inputs
        id: hash
        run: |
          echo "key=$(sha256sum scripts/build-ffmpeg.sh | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore FFmpeg cache
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: build/${{ matrix.abi }}/libffmpeg.so
          key: ffmpeg-${{ matrix.abi }}-${{ steps.hash.outputs.key }}

      - name: Install build deps
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            make pkg-config yasm nasm autoconf automake libtool

      - name: Build FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "Using NDK at: $ANDROID_NDK_HOME"
          test -d "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" \
            || { echo "NDK toolchain not found"; exit 1; }
          ./scripts/build-ffmpeg.sh ${{ matrix.abi }}

      - name: Upload FFmpeg binary
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.abi }}
          path: build/${{ matrix.abi }}/libffmpeg.so
          if-no-files-found: error
          retention-days: 7

  build-apk:
    name: Build APK
    needs: build-ffmpeg
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Download FFmpeg binaries
        uses: actions/download-artifact@v4
        with:
          path: ffmpeg-bins
          pattern: ffmpeg-*

      - name: Place binaries into jniLibs
        run: |
          set -e
          for d in ffmpeg-bins/ffmpeg-*; do
            abi="${d#ffmpeg-bins/ffmpeg-}"
            mkdir -p "app/src/main/jniLibs/$abi"
            cp "$d/libffmpeg.so" "app/src/main/jniLibs/$abi/libffmpeg.so"
            ls -lah "app/src/main/jniLibs/$abi/libffmpeg.so"
          done

      - name: Install Gradle 8.7
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Stage APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
             artifacts/AudioConverter-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioConverter-debug-apk
          path: artifacts/AudioConverter-debug.apk
          if-no-files-found: error

      - name: Publish rolling release
        if: github.event_name == 'push'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "Audio Converter build #${{ github.run_number }}"
          files: artifacts/AudioConverter-debug.apk
          generate_release_notes: false
          prerelease: true
