name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    name: Shared resources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON files
        run: |
          for f in $(find shared -name '*.json'); do
            python3 -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" "$f" || { echo "Invalid JSON: $f"; exit 1; }
          done
      - name: Test vectors are up to date
        run: |
          python3 shared/tools/reference_engine.py
          git diff --exit-code shared/tests/engine-cases.json

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and APK
        working-directory: android
        run: ./gradlew :core:test :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Tippli-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-reports
          path: android/**/build/reports/tests/

  apple:
    name: iOS + macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Tests and builds
        run: bash apple/ci-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Tippli-macOS
          path: apple/build/TippliMac.zip
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Unit tests
        run: dotnet test windows/tests/Tippli.Core.Tests -c Release
      - name: Publish single-file exe
        run: dotnet publish windows/src/Tippli.Windows -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o windows/publish
      - uses: actions/upload-artifact@v4
        with:
          name: Tippli-Windows
          path: windows/publish/
          if-no-files-found: error
